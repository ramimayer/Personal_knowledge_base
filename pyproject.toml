[project]
name = "personal-knowledge-base"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rami Mayer", email = "rami.mayer@yahoo.com" }
]
requires-python = ">=3.14"
dependencies = [
    "docx>=0.2.4",
    "docx2txt>=0.9",
    "fastapi[standard]>=0.143.0",
    "fastembed>=0.8.1",
    "fonttools>=4.66.1",
    "imap-tools>=1.15.0",
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.6.7",
    "langchain-openrouter>=0.2.9",
    "langchain-qdrant>=1.1.0",
    "pdf2image>=1.17.0",
    "pypdf>=6.19.0",
    "pypdf2>=3.0.1",
    "pytesseract>=0.3.13",
    "pytest>=9.1.1",
    "pytest-mock>=3.16.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
server="personal_knowledge_base.web_service:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.16.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]


[tool.uv]
python-preference = "only-system"

[tool.uv.build-backend]
module-name = ["personal_knowledge_base"]
namespace=true

